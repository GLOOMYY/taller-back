[project]
name = "taller-back"
version = "0.2.0"
description = "API de Taller construida con FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic-settings==2.10.1",
    "pymongo==4.13.2",
    "PyJWT[crypto]==2.10.1",
    "reportlab==4.4.3",
    "pycountry==24.6.1",
    "Babel==2.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requiere MongoDB local con replica set",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
exclude = ["tests"]
plugins = ["pydantic.mypy"]
