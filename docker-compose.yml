services:
  mongodb:
    image: mongo:8.0.13
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init_replica_set.js:/docker-entrypoint-initdb.d/init_replica_set.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'try { quit(rs.status().ok ? 0 : 1) } catch (error) { quit(rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"localhost:27017\"}]}).ok ? 0 : 1) }'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  mongodb_data:
